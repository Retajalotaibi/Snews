# render.yaml — Render deployment configuration
# Deploy the MarketLens API server as a Render Web Service.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: marketlens-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: "npm install -g pnpm && pnpm install --frozen-lockfile && pnpm run build"
    startCommand: "node --enable-source-maps artifacts/api-server/dist/index.mjs"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: MONGODB_URI
        sync: false   # Set this in the Render dashboard
      - key: MONGODB_DB_NAME
        value: marketlens
      - key: NEWS_API_KEY
        sync: false   # Set this in the Render dashboard
      - key: ALPHA_VANTAGE_API_KEY
        sync: false   # Set this in the Render dashboard
    healthCheckPath: /api/healthz
